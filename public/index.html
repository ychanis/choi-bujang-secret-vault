<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>내 자료실</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef3f8;color:#182536;font-family:system-ui,sans-serif}main{max-width:820px;margin:auto;padding:44px 20px}h1{font-size:36px}section,li{padding:24px;background:white;border:1px solid #d5dfeb;border-radius:16px;margin:16px 0}label{display:block;margin:12px 0 6px}input,textarea{width:100%;padding:12px;border:1px solid #aebccd;border-radius:8px;color:#182536;background:white;font:inherit}textarea{min-height:120px}button{padding:11px 18px;background:#235d9c;color:white;border:0;border-radius:8px;margin:12px 8px 0 0;cursor:pointer;font:inherit}button:disabled{opacity:.5}ul{padding:0;list-style:none}li p{white-space:pre-wrap;overflow-wrap:anywhere}.muted{color:#536477}#message{min-height:24px;color:#9c243c}[hidden]{display:none!important}
</style><link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#235d9c"><link rel="icon" href="/app-icon.svg" type="image/svg+xml"></head><body><main><p class="muted">BYTE BACK · 내 자료실</p><h1>내 메모를 안전하게</h1><p id="status">로그인 상태를 확인하고 있어요.</p><p id="message" role="status" aria-live="polite"></p>
<section aria-labelledby="app-heading"><h2 id="app-heading">내 자료실 접속 앱</h2><p id="device-status" role="status">기기 승인 상태: 미확인</p><p class="muted">앱 설치와 기기 승인은 별개입니다. 설치만으로 보호 자료 접근 권한이 생기지 않습니다.</p><p id="network-status" role="status"></p><button id="install-app" type="button" hidden>앱 설치</button><p id="install-help" class="muted">지원하는 브라우저 메뉴에서 앱을 설치할 수 있습니다.</p></section>
<section id="device-panel" hidden><h2>이번 접속의 기기 승인</h2><p>승인 요청을 보낸 뒤, 관리자가 확인한 기기에서만 메모를 열 수 있어요.</p><p class="muted">키와 로그인 토큰은 저장하지 않습니다. 화면을 새로 열면 다시 로그인하고 승인받아 주세요.</p><button id="request-device" type="button">기기 승인 요청</button><button id="check-device" type="button">승인 결과 확인</button><button id="device-logout" type="button">로그아웃</button><p>관리자 확인용 기기 지문:</p><code id="device-fingerprint" style="display:block;overflow-wrap:anywhere"></code></section>
<section id="login"><h2>로그인</h2><form id="login-form"><label for="email">이메일</label><input id="email" type="email" autocomplete="username" required><label for="password">비밀번호</label><input id="password" type="password" autocomplete="current-password" required><button>로그인</button></form></section>
<div id="workspace" hidden><button id="logout">로그아웃</button><section><h2 id="editor-heading">메모 추가</h2><form id="editor"><label for="title">제목</label><input id="title" maxlength="200" required><label for="body">내용</label><textarea id="body" maxlength="10000"></textarea><button id="save">저장</button><button id="cancel" type="button">새 메모 작성</button></form></section><h2>내 메모</h2><button id="refresh">새로고침</button><ul id="notes"></ul></div>
<script type="module" src="/app-shell.js"></script>
<script type="module" src="/app.js"></script></main></body></html>
